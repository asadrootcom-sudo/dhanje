<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 100"
     width="200"
     height="100"
     role="img"
     aria-labelledby="title desc">
  <title id="title">دهان جدة - DHANJE</title>
  <desc id="desc">شعار دهان جدة مع الأيقونة الأصلية على اليمين والنص العربي فوق الإنجليزي.</desc>

  <!-- النص -->
  <g font-family="Tahoma, Arial, sans-serif">
    <text x="160" y="42"
          font-size="25"
          font-weight="700"
          fill="#E67E22"
          direction="rtl"
          text-anchor="middle">دهان جدة</text>

    <text x="185" y="65"
          font-family="Arial, sans-serif"
          font-size="10"
          font-weight="800"
          letter-spacing="3"
          fill="#102A43"
          text-anchor="middle">DHANJE</text>
  </g>

  <!-- الأيقونة الأصلية من كود HTML كما أرسلها المستخدم -->
  <g transform="translate(220 5) scale(0.95)">
    <rect x="10" y="10" width="30" height="80" fill="#102A43"/>
    <path d="M40 10
         L55 10
         C80 10, 80 90, 55 90
         L40 90
         L40 70
         L45 70
         C60 70, 60 30, 45 30
         L40 30
         Z"
      fill="#E67E22"/>
  </g>
